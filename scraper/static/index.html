<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Show Price Tracker</title>
<style>
:root {
  color-scheme: light;
  --surface-0: #f5f4f1; --surface-1: #fcfcfb; --surface-2: #f0efec; --hairline: #e6e5e0;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #77766f;
  --series-1: #2a78d6; --series-1-wash: rgba(42,120,214,.10);
  --good: #0ca30c; --good-bg: #e3f4e3; --good-text: #0a6b0a;
  --critical: #d03b3b; --critical-text: #a3332f; --critical-bg: #fbeaea;
  --accent: #2a78d6; --accent-text: #fff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-0: #121211; --surface-1: #1a1a19; --surface-2: #252523; --hairline: #31312e;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #94938a;
    --series-1: #3987e5; --series-1-wash: rgba(57,135,229,.14);
    --good-bg: #173117; --good-text: #7fd67f; --critical-text: #f08a8a; --critical-bg: #3a1d1d;
    --accent: #3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #121211; --surface-1: #1a1a19; --surface-2: #252523; --hairline: #31312e;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #94938a;
  --series-1: #3987e5; --series-1-wash: rgba(57,135,229,.14);
  --good-bg: #173117; --good-text: #7fd67f; --critical-text: #f08a8a; --critical-bg: #3a1d1d;
  --accent: #3987e5;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface-0); color: var(--text-primary);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 64px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
h1 { font-size: 24px; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 17px; margin: 32px 0 12px; }
.muted { color: var(--text-secondary); }
.small { font-size: 13px; }
button, .btn { font: inherit; font-size: 13px; border: 1px solid var(--hairline); background: var(--surface-1);
  color: var(--text-primary); border-radius: 8px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
button:hover { border-color: var(--text-muted); }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button:disabled { opacity: .55; cursor: default; }
input[type=text], input[type=url], input[type=search] { font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 8px;
  border: 1px solid var(--hairline); background: var(--surface-1); color: var(--text-primary); min-width: 0; }
.card { background: var(--surface-1); border: 1px solid var(--hairline); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.show-head { display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center; }
.thumb { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; background: var(--surface-2); }
.show-name { font-weight: 600; font-size: 16px; }
.headline { font-size: 14px; color: var(--text-secondary); }
.headline b { color: var(--text-primary); font-size: 18px; margin-right: 4px; }
.delta-down { color: var(--good-text); } .delta-up { color: var(--critical-text); }
.actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.chip { border: 1px solid var(--hairline); border-radius: 8px; padding: 5px 10px; font-size: 13px; background: var(--surface-1); }
.chip .p { font-weight: 600; margin-left: 6px; }
.chip.deal { background: var(--good-bg); border-color: transparent; }
.tag-deal { background: var(--good-bg); color: var(--good-text); border-radius: 4px; padding: 1px 6px; font-weight: 600; font-size: 12px; white-space: nowrap; }
.warn { margin-top: 10px; font-size: 13px; color: var(--critical-text); background: var(--critical-bg); border-radius: 8px; padding: 6px 10px; }
.running { font-size: 12px; color: var(--accent); }
.spark { display: block; }
.detail { margin-top: 16px; border-top: 1px solid var(--hairline); padding-top: 16px; }
.charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.chart-title { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
.chart-sub { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; min-height: 18px; }
.chart { position: relative; height: 220px; }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.tip { position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--hairline);
  box-shadow: 0 4px 16px rgba(0,0,0,.12); border-radius: 8px; padding: 6px 9px; font-size: 12px; white-space: nowrap; z-index: 2; display: none; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 16px; }
th { text-align: left; font-weight: 500; color: var(--text-secondary); padding: 6px 8px; border-bottom: 1px solid var(--hairline); position: sticky; top: 0; background: var(--surface-1); }
td { padding: 6px 8px; border-bottom: 1px solid var(--hairline); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr { cursor: pointer; } tbody tr:hover, tbody tr.sel { background: var(--surface-2); }
.table-wrap { max-height: 360px; overflow: auto; }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.tabs button[aria-pressed=true] { background: var(--text-primary); color: var(--surface-1); border-color: var(--text-primary); }
.add-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.add-row input { flex: 1 1 220px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.cat { display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: center; background: var(--surface-1);
  border: 1px solid var(--hairline); border-radius: 10px; padding: 8px; }
.cat img { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; background: var(--surface-2); }
.cat .n { font-size: 13px; font-weight: 600; line-height: 1.25; }
.cat .v { font-size: 12px; color: var(--text-secondary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cat button.on { background: var(--good-bg); color: var(--good-text); border-color: transparent; }
.msg { font-size: 13px; margin: -4px 0 12px; }
.msg.err { color: var(--critical-text); }
.empty { padding: 24px; text-align: center; color: var(--text-secondary); }
@media (max-width: 720px) {
  .charts { grid-template-columns: 1fr; }
  .show-head { grid-template-columns: 44px 1fr; }
  .thumb { width: 44px; height: 44px; }
  .actions { grid-column: 1 / -1; justify-content: flex-start; }
}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Show prices</h1>
      <div class="muted small" id="lastrun"></div>
    </div>
    <div class="actions">
      <span class="running" id="runall-status"></span>
      <button id="runall">Check all now</button>
    </div>
  </header>

  <section id="tracked"></section>

  <h2>Add shows</h2>
  <div class="add-row">
    <input type="url" id="paste-url" placeholder="Paste a TodayTix, ATG, or Met Opera SmartSeat URL">
    <input type="text" id="paste-name" placeholder="Name (optional)" style="flex:0 1 200px">
    <button class="primary" id="paste-go">Track</button>
  </div>
  <div class="msg" id="paste-msg"></div>
  <div class="add-row">
    <input type="search" id="search" placeholder="Search the TodayTix catalog">
  </div>
  <div class="tabs" id="cat-tabs"></div>
  <div class="grid" id="catalog"></div>
  <p class="muted small" id="catalog-note"></p>
</main>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = c => c == null ? "—" : (c % 100 ? "$" + (c / 100).toFixed(2) : "$" + (c / 100).toLocaleString());
const signed = c => (c > 0 ? "▲ +" : "▼ −") + money(Math.abs(c));
const dt = s => new Date(s);  // naive local NYC strings; the viewer is in NYC
const fmtWhen = s => dt(s).toLocaleString([], {weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit"}).replace(":00", "");
const fmtDay = s => dt(s.length === 10 ? s + "T12:00" : s).toLocaleDateString([], {month: "short", day: "numeric"});
const fmtAgo = s => { const m = (Date.now() - dt(s)) / 60000; return m < 2 ? "just now" : m < 60 ? `${Math.round(m)} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : fmtDay(s); };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

let STATE = {shows: [], running: []}, CATALOG = [], OPEN = new Set(), DETAIL = {}, CAT_FILTER = "All", SORT = {};

async function api(path, body) {
  const r = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

// ---------- chart (hand-rolled SVG: one series, hairline grid, crosshair + tooltip) ----------
function niceTicks(lo, hi, n = 4) {
  if (lo === hi) { lo = lo * 0.9; hi = hi * 1.1 || 1; }
  const span = hi - lo, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= n) || 10 * mag;
  const t = [], top = Math.ceil(hi / step - 1e-9) * step;  // the top tick always covers the max
  for (let v = Math.floor(lo / step) * step; v <= top + 1e-9; v += step) t.push(v);
  return t;
}
function chart(el, pts, {line = true, tip, onPick, selected} = {}) {
  el.innerHTML = "";
  if (!pts.length) { el.innerHTML = `<div class="empty small">No data yet</div>`; return; }
  const W = el.clientWidth, H = el.clientHeight, m = {l: 44, r: 10, t: 10, b: 24};
  const xs = pts.map(p => +p.x), ys = pts.map(p => p.y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) { x0 -= 864e5; x1 += 864e5; }
  const yt = niceTicks(Math.min(0, ...ys) === 0 && Math.min(...ys) < 0.4 * Math.max(...ys) ? 0 : Math.min(...ys), Math.max(...ys));
  const y0 = yt[0], y1 = yt[yt.length - 1];
  const X = v => m.l + (v - x0) / (x1 - x0) * (W - m.l - m.r), Y = v => H - m.b - (v - y0) / (y1 - y0 || 1) * (H - m.t - m.b);
  const ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg");
  const add = (tag, attrs, parent = svg) => { const e = document.createElementNS(ns, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
  const ink = css("--text-muted"), grid = css("--hairline"), blue = css("--series-1"), good = css("--good"), surf = css("--surface-1");
  for (const v of yt) {
    add("line", {x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), stroke: grid, "stroke-width": 1});
    add("text", {x: m.l - 6, y: Y(v) + 4, "text-anchor": "end", "font-size": 11, fill: ink}).textContent = money(Math.round(v));
  }
  const nx = Math.max(2, Math.min(6, Math.floor((W - m.l) / 90)));
  for (let i = 0; i < nx; i++) {
    const v = x0 + (x1 - x0) * i / (nx - 1);
    add("text", {x: X(v), y: H - 6, "text-anchor": i === 0 ? "start" : i === nx - 1 ? "end" : "middle", "font-size": 11, fill: ink})
      .textContent = new Date(v).toLocaleDateString([], {month: "short", day: "numeric"});
  }
  if (line && pts.length > 1) {
    const d = pts.map((p, i) => (i ? "L" : "M") + X(+p.x).toFixed(1) + " " + Y(p.y).toFixed(1)).join(" ");
    add("path", {d: d + ` L${X(+pts.at(-1).x)} ${H - m.b} L${X(+pts[0].x)} ${H - m.b} Z`, fill: css("--series-1-wash"), stroke: "none"});
    add("path", {d, fill: "none", stroke: blue, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round"});
  }
  const dense = pts.length > 60;
  for (const p of pts) {
    const r = p.deal ? 5.5 : dense ? 3 : 4;
    add("circle", {cx: X(+p.x), cy: Y(p.y), r, fill: p.deal ? good : blue, stroke: surf, "stroke-width": 2});
    if (selected && p.key === selected) add("circle", {cx: X(+p.x), cy: Y(p.y), r: r + 4, fill: "none", stroke: css("--text-primary"), "stroke-width": 1.5});
  }
  const cross = add("line", {y1: m.t, y2: H - m.b, stroke: ink, "stroke-width": 1, visibility: "hidden"});
  const ring = add("circle", {r: 6, fill: "none", stroke: css("--text-primary"), "stroke-width": 1.5, visibility: "hidden"});
  el.appendChild(svg);
  const tipEl = document.createElement("div"); tipEl.className = "tip"; el.appendChild(tipEl);
  const nearest = ev => {
    const bx = svg.getBoundingClientRect(), mx = ev.clientX - bx.left;
    let best = null, bd = Infinity; for (const p of pts) { const d = Math.abs(X(+p.x) - mx); if (d < bd) { bd = d; best = p; } }
    return bd < 40 ? best : null;
  };
  svg.addEventListener("mousemove", ev => {
    const p = nearest(ev); if (!p) { svg.dispatchEvent(new Event("mouseleave")); return; }
    const cx = X(+p.x), cy = Y(p.y);
    cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("visibility", "visible");
    ring.setAttribute("cx", cx); ring.setAttribute("cy", cy); ring.setAttribute("visibility", "visible");
    tipEl.innerHTML = tip(p); tipEl.style.display = "block";
    const tw = tipEl.offsetWidth; tipEl.style.left = Math.min(Math.max(cx - tw / 2, 0), W - tw) + "px"; tipEl.style.top = Math.max(cy - tipEl.offsetHeight - 12, 0) + "px";
    svg.style.cursor = onPick ? "pointer" : "default";
  });
  svg.addEventListener("mouseleave", () => { cross.setAttribute("visibility", "hidden"); ring.setAttribute("visibility", "hidden"); tipEl.style.display = "none"; });
  if (onPick) svg.addEventListener("click", ev => { const p = nearest(ev); if (p) onPick(p); });
}
function sparkline(trend) {
  if (trend.length < 2) return "";
  const W = 120, H = 32, ys = trend.map(t => t[1]), lo = Math.min(...ys), hi = Math.max(...ys) || 1;
  const pts = trend.map((t, i) => [i / (trend.length - 1) * (W - 8) + 4, H - 5 - (hi === lo ? 0.5 : (t[1] - lo) / (hi - lo)) * (H - 10)]);
  const last = pts.at(-1);
  return `<svg class="spark" width="${W}" height="${H}" aria-label="cheapest price trend"><path d="${pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ")}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="4" fill="var(--series-1)" stroke="var(--surface-1)" stroke-width="2"/></svg>`;
}

// ---------- tracked shows ----------
function headline(s) {
  if (!s.perfs.length) {
    if (!s.status) return `<span class="muted">Not checked yet</span>`;
    return `<span class="muted">${{sold_out: "Sold out", no_inventory: "Nothing on sale", scrape_failed: "Couldn't check"}[s.status] || s.status}</span>`;
  }
  const b = s.cheapest[0], ch = s.low_change_cents;
  return `<b>${money(b.price_cents)}</b> cheapest · ${fmtWhen(b.performance)}${ch ? ` · <span class="${ch < 0 ? "delta-down" : "delta-up"}">${signed(ch)}</span> vs previous day` : ""}`;
}
function problem(s) {
  if (s.status === "scrape_failed") return `Last check failed: ${esc(s.reason)}${s.last_good_at ? `. Showing prices from ${fmtAgo(s.last_good_at)}.` : ""}`;
  if (s.status === "available" && s.reason) return esc(s.reason);
  return "";
}
function renderTracked() {
  const el = $("#tracked");
  if (!STATE.shows.length) { el.innerHTML = `<div class="card empty">You're not tracking any shows yet. Pick some from the catalog below, or paste a URL.</div>`; return; }
  el.innerHTML = STATE.shows.map(s => {
    const busy = STATE.running.includes(String(s.id)) || STATE.running.includes("all");
    const p = problem(s);
    return `<div class="card" id="show-${s.id}">
      <div class="show-head">
        ${s.image_url ? `<img class="thumb" src="${esc(s.image_url)}" alt="">` : `<div class="thumb"></div>`}
        <div>
          <div class="show-name">${esc(s.name)} <span class="muted small">· ${esc(s.site)}</span></div>
          <div class="headline">${headline(s)}</div>
          <div class="muted small">${s.checked_at ? "Checked " + fmtAgo(s.checked_at) : ""}${busy ? ` · <span class="running">checking…</span>` : ""}</div>
        </div>
        <div class="actions">
          ${sparkline(s.trend)}
          <button data-act="detail" data-id="${s.id}">${OPEN.has(s.id) ? "Hide" : "Calendar & history"}</button>
          <button data-act="check" data-id="${s.id}" ${busy ? "disabled" : ""}>Check now</button>
          <a class="btn" href="${esc(s.url)}" target="_blank" rel="noopener">Buy</a>
          <button data-act="untrack" data-id="${s.id}" title="Stop tracking">✕</button>
        </div>
      </div>
      ${p ? `<div class="warn">⚠ ${p}</div>` : ""}
      ${s.cheapest.length ? `<div class="chips">${s.cheapest.map(c => `<span class="chip ${c.deal ? "deal" : ""}">${fmtWhen(c.performance)}<span class="p">${money(c.price_cents)}</span>${c.deal ? ` <span class="tag-deal">Deal</span>` : ""}</span>`).join("")}</div>` : ""}
      ${OPEN.has(s.id) ? `<div class="detail" id="detail-${s.id}"><div class="muted small">Loading…</div></div>` : ""}
    </div>`;
  }).join("");
  for (const id of OPEN) loadDetail(id);
}
async function loadDetail(id) {
  const prevSel = DETAIL[id]?.selected || null;
  try { DETAIL[id] = await api(`/api/show/${id}`); } catch (e) { return; }
  DETAIL[id].selected = prevSel;
  drawDetail(id);
}
function drawDetail(id) {
  const d = DETAIL[id], el = $(`#detail-${id}`); if (!el || !d) return;
  if (!d.perfs.length) { el.innerHTML = `<div class="muted small">No upcoming prices yet.</div>`; return; }
  const sort = SORT[id] || "date";
  const rows = [...d.perfs].sort((a, b) => sort === "price" ? a.price_cents - b.price_cents || a.performance.localeCompare(b.performance) : a.performance.localeCompare(b.performance));
  const sel = d.selected, hasDeal = d.perfs.some(p => p.deal);
  el.innerHTML = `
    <div class="charts">
      <div>
        <div class="chart-title">Price by performance</div>
        <div class="chart-sub">Today's cheapest ticket for each upcoming date. Click a dot to see its history.</div>
        <div class="chart" id="c1-${id}"></div>
        ${hasDeal ? `<div class="legend"><span><i style="background:var(--series-1)"></i>Price</span><span><i style="background:var(--good)"></i>Deal (≥20% below its usual price)</span></div>` : ""}
      </div>
      <div>
        <div class="chart-title">${sel ? "Price history · " + fmtWhen(sel) : "Cheapest upcoming price over time"}</div>
        <div class="chart-sub">${sel ? `<a href="#" data-act="clearsel" data-id="${id}">← back to cheapest overall</a>` : "One point per day checked."}</div>
        <div class="chart" id="c2-${id}"></div>
      </div>
    </div>
    <div class="tabs" style="margin-top:16px">
      <button data-act="sort" data-id="${id}" data-sort="date" aria-pressed="${sort === "date"}">By date</button>
      <button data-act="sort" data-id="${id}" data-sort="price" aria-pressed="${sort === "price"}">By price</button>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Performance</th><th class="num">Price</th><th class="num">Usually</th><th class="num">Since last check</th><th></th></tr></thead>
      <tbody>${rows.map(p => `<tr data-act="pick" data-id="${id}" data-perf="${p.performance}" class="${p.performance === sel ? "sel" : ""}">
        <td>${fmtWhen(p.performance)}</td><td class="num"><b>${money(p.price_cents)}</b></td>
        <td class="num muted">${p.usual_cents != null ? money(p.usual_cents) : "—"}</td>
        <td class="num ${p.change_cents < 0 ? "delta-down" : p.change_cents > 0 ? "delta-up" : "muted"}">${p.change_cents ? signed(p.change_cents) : "—"}</td>
        <td>${p.deal ? `<span class="tag-deal">Deal −${Math.round((1 - p.price_cents / p.usual_cents) * 100)}%</span> ` : ""}<span class="muted">${esc(p.detail || "")}</span></td></tr>`).join("")}</tbody>
    </table></div>`;
  const pick = perf => { d.selected = perf; drawDetail(id); };
  chart($(`#c1-${id}`), d.perfs.map(p => ({x: dt(p.performance), y: p.price_cents, deal: p.deal, key: p.performance, p})), {
    line: false, selected: sel, onPick: pt => pick(pt.key),
    tip: ({p}) => `<b>${fmtWhen(p.performance)}</b><br>${money(p.price_cents)}${p.usual_cents != null ? ` · usually ${money(p.usual_cents)}` : ""}${p.deal ? "<br>✓ Deal" : ""}${p.detail ? `<br><span class="muted">${esc(p.detail)}</span>` : ""}`,
  });
  const series = sel ? (d.history[sel] || []) : d.trend;
  chart($(`#c2-${id}`), series.map(([day, c]) => ({x: dt(day + "T12:00"), y: c, day})), {
    tip: p => `<b>${fmtDay(p.day)}</b><br>${money(p.y)}`,
  });
}

// ---------- catalog ----------
function renderCatalog() {
  const cats = ["All", ...new Set(CATALOG.map(c => c.category))];
  $("#cat-tabs").innerHTML = cats.map(c => `<button data-act="cat" data-cat="${esc(c)}" aria-pressed="${c === CAT_FILTER}">${esc(c)}</button>`).join("");
  const q = $("#search").value.trim().toLowerCase();
  const items = CATALOG.filter(c => (CAT_FILTER === "All" || c.category === CAT_FILTER) && (!q || (c.name + " " + (c.venue || "")).toLowerCase().includes(q)));
  $("#catalog").innerHTML = items.map(c => `<div class="cat">
      ${c.image_url ? `<img src="${esc(c.image_url)}" alt="" loading="lazy">` : `<div class="thumb" style="width:48px;height:48px"></div>`}
      <div><div class="n">${esc(c.name)}</div><div class="v" title="${esc(c.venue || "")}">${esc(c.venue || c.category)}${c.from_price_cents ? " · from " + money(c.from_price_cents) : ""}</div></div>
      ${c.tracked ? `<button class="on" data-act="untrack" data-id="${c.show_id}">✓ Tracking</button>` : `<button data-act="trackcat" data-url="${esc(c.url)}">Track</button>`}
    </div>`).join("") || `<div class="muted small">No matches.</div>`;
  $("#catalog-note").textContent = CATALOG.length ? `${CATALOG.length} shows from TodayTix, refreshed ${STATE.catalog_updated ? fmtAgo(STATE.catalog_updated) : "—"}. Not listed? Paste its URL above.` : "Catalog not loaded yet. It refreshes with the daily check.";
}

// ---------- wiring ----------
async function refresh() {
  STATE = await api("/api/state");
  const times = STATE.shows.map(s => s.checked_at).filter(Boolean).sort();
  $("#lastrun").textContent = times.length ? `Last checked ${fmtAgo(times.at(-1))} · digest emails daily at 8 AM` : "Not checked yet";
  $("#runall").disabled = STATE.running.includes("all");
  $("#runall-status").textContent = STATE.running.length ? "checking…" : "";
  renderTracked();
}
async function refreshCatalog() { CATALOG = await api("/api/catalog"); renderCatalog(); }
let poll = null;
function pollWhileRunning() {
  clearInterval(poll);
  poll = setInterval(async () => {
    const was = STATE.running.length; await refresh();
    if (!STATE.running.length && was) { clearInterval(poll); refreshCatalog(); }
  }, 4000);
}

document.addEventListener("click", async ev => {
  const t = ev.target.closest("[data-act]"); if (!t) return;
  const id = Number(t.dataset.id), act = t.dataset.act;
  if (act === "clearsel") ev.preventDefault();
  try {
    if (act === "detail") { OPEN.has(id) ? OPEN.delete(id) : OPEN.add(id); renderTracked(); }
    else if (act === "check") { await api("/api/check", {id}); await refresh(); pollWhileRunning(); }
    else if (act === "untrack") { await api("/api/untrack", {id}); OPEN.delete(id); await refresh(); await refreshCatalog(); }
    else if (act === "trackcat") { t.disabled = true; await api("/api/track", {url: t.dataset.url}); await refresh(); await refreshCatalog(); pollWhileRunning(); }
    else if (act === "cat") { CAT_FILTER = t.dataset.cat; renderCatalog(); }
    else if (act === "sort") { SORT[id] = t.dataset.sort; drawDetail(id); }
    else if (act === "pick") { DETAIL[id].selected = t.dataset.perf; drawDetail(id); }
    else if (act === "clearsel") { DETAIL[id].selected = null; drawDetail(id); }
  } catch (e) { alertMsg(e.message); }
});
function alertMsg(m, ok) { const el = $("#paste-msg"); el.textContent = m; el.className = "msg" + (ok ? "" : " err"); }
$("#paste-go").addEventListener("click", async () => {
  const url = $("#paste-url").value.trim(), name = $("#paste-name").value.trim();
  if (!url) return;
  try {
    const r = await api("/api/track", {url, name});
    alertMsg(`Tracking ${r.name}. Checking it now…`, true);
    $("#paste-url").value = ""; $("#paste-name").value = "";
    await refresh(); await refreshCatalog(); pollWhileRunning();
  } catch (e) { alertMsg(e.message); }
});
$("#runall").addEventListener("click", async () => { await api("/api/check", {}); await refresh(); pollWhileRunning(); });
$("#search").addEventListener("input", renderCatalog);
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => OPEN.forEach(drawDetail), 150); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => OPEN.forEach(drawDetail));

(async () => {
  await refresh(); await refreshCatalog();
  const m = location.hash.match(/^#show-(\d+)$/);
  if (m) { OPEN.add(Number(m[1])); renderTracked(); setTimeout(() => $(location.hash)?.scrollIntoView(), 300); }
  if (STATE.running.length) pollWhileRunning();
})();
</script>
</body>
</html>
